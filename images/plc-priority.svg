<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="740" viewBox="0 0 1200 740"><rect width="1200" height="740" fill="#f1f6f3"/><g font-family="sans-serif" fill="#14383e"><text x="50" y="60" font-size="32" font-weight="700">Choose a transition before computing the output</text><text x="50" y="98" font-size="21">Our model uses this priority order, once per input snapshot.</text><rect x="50" y="140" width="1100" height="88" rx="12" fill="white" stroke="#bbd2cd"/><circle cx="93" cy="184" r="25" fill="#153e45"/><text x="93" y="192" text-anchor="middle" font-size="24" fill="white">1</text><text x="140" y="176" font-size="24" font-weight="700">Permit lost</text><text x="140" y="206" font-size="22">Any state becomes FAULT.</text><rect x="50" y="244" width="1100" height="88" rx="12" fill="white" stroke="#bbd2cd"/><circle cx="93" cy="288" r="25" fill="#153e45"/><text x="93" y="296" text-anchor="middle" font-size="24" fill="white">2</text><text x="140" y="280" font-size="24" font-weight="700">Stop active</text><text x="140" y="310" font-size="22">RUNNING becomes IDLE; otherwise hold.</text><rect x="50" y="348" width="1100" height="88" rx="12" fill="white" stroke="#bbd2cd"/><circle cx="93" cy="392" r="25" fill="#153e45"/><text x="93" y="400" text-anchor="middle" font-size="24" fill="white">3</text><text x="140" y="384" font-size="24" font-weight="700">Latched state</text><text x="140" y="414" font-size="22">FAULT or COMPLETE: fresh reset enters IDLE.</text><rect x="50" y="452" width="1100" height="88" rx="12" fill="white" stroke="#bbd2cd"/><circle cx="93" cy="496" r="25" fill="#153e45"/><text x="93" y="504" text-anchor="middle" font-size="24" fill="white">4</text><text x="140" y="488" font-size="24" font-weight="700">IDLE</text><text x="140" y="518" font-size="22">Fresh start and no part: enter RUNNING.</text><rect x="50" y="556" width="1100" height="88" rx="12" fill="white" stroke="#bbd2cd"/><circle cx="93" cy="600" r="25" fill="#153e45"/><text x="93" y="608" text-anchor="middle" font-size="24" fill="white">5</text><text x="140" y="592" font-size="24" font-weight="700">RUNNING</text><text x="140" y="622" font-size="22">Part: COMPLETE. Else deadline: FAULT.</text><text x="50" y="700" font-size="22">After the transition: motor = (state == RUNNING). All other states: motor off.</text></g></svg>